<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex 대화</title>
<link rel="icon" href="/assets/avatar-codex.png">
<style>
:root {
  --bg: #ffffff; --side: #f5f5f7; --line: #e5e5ea; --text: #1c1c1e; --muted: #8e8e93; --hover: #ebebf0; --sel: #e4e4ea;
  --claude-a: #e8845c; --claude-b: #d4643f; --claude-text: #ffffff;
  --codex-bubble: #e9e9ee; --codex-text: #1c1c1e;
  --q: #f08c2e; --q-bg: #fff4e6;
  --ok: #34a853; --live: #0a84ff; --warn: #c27c00; --warn-bg: #fff6dc; --err: #e5484d;
  --code-bg: rgba(0, 0, 0, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --side: #1c1c1e; --line: #2c2c2e; --text: #f2f2f7; --muted: #8e8e93; --hover: #2c2c2e; --sel: #3a3a3c;
    --claude-a: #e07a52; --claude-b: #c85a36;
    --codex-bubble: #2c2c2e; --codex-text: #f2f2f7;
    --q: #ff9f43; --q-bg: #33250f;
    --ok: #30d158; --live: #0a84ff; --warn: #ffd60a; --warn-bg: #2e2708; --err: #ff6961;
    --code-bg: rgba(255, 255, 255, .08);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
.app { display: grid; grid-template-columns: 330px minmax(0, 1fr); height: 100vh; height: 100dvh; }

/* ---------------- 아바타 (이미지가 없으면 글자) */
.av { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--c, #8e8e93); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 17px; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.sm { width: 28px; height: 28px; font-size: 12px; }
.av.md { width: 36px; height: 36px; font-size: 14px; }

/* ---------------- 대화 목록 */
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side-h { padding: 18px 16px 10px; }
.side-h h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.follow { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--muted); cursor: pointer; }
#list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
.conv { display: flex; gap: 11px; align-items: center; padding: 10px; border-radius: 12px; cursor: pointer; }
.conv:hover { background: var(--hover); }
.conv.active { background: var(--sel); }
.conv.child { margin-left: 22px; }
.conv .txt { min-width: 0; flex: 1; }
.conv .l1 { display: flex; align-items: baseline; gap: 6px; }
.conv .name { font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .when { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); }
.conv .ttl { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .st { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv .st.running { color: var(--live); }
.conv .st.question { color: var(--q); font-weight: 600; }
.conv .st.stalled { color: var(--warn); }
.conv .st.error { color: var(--err); }
.side-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }

/* ---------------- 대화창 */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.chat-h { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); min-height: 60px; }
.chat-h .back { display: none; font-size: 26px; line-height: 1; color: var(--live); padding: 0 6px 2px 0; }
.chat-h .who { min-width: 0; flex: 1; }
.chat-h .nm { font-weight: 700; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-h .sub { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.chat-h .sub .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chat-h .sub.running { color: var(--live); }
.chat-h .sub.running .dot { animation: blink 1.2s infinite; }
.chat-h .sub.question { color: var(--q); font-weight: 600; }
.chat-h .sub.done { color: var(--ok); }
.chat-h .sub.stalled, .chat-h .sub.lost { color: var(--warn); }
.chat-h .sub.error { color: var(--err); }
@keyframes blink { 50% { opacity: .3; } }
#banner { display: none; padding: 8px 18px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; text-align: center; }
#banner.on { display: block; }

#feed { flex: 1; overflow-y: auto; padding: 14px 18px 28px; }
.thread-inner { max-width: 780px; margin: 0 auto; }
.stamp { text-align: center; font-size: 11.5px; color: var(--muted); margin: 18px 0 8px; }
.stamp b { font-weight: 600; }
.sys { text-align: center; font-size: 12.5px; color: var(--muted); margin: 10px 0; }
.sys.err { color: var(--err); }

.msg { display: flex; gap: 8px; align-items: flex-end; margin-top: 2px; }
.msg.first { margin-top: 12px; }
.msg .col { display: flex; flex-direction: column; max-width: min(76%, 560px); min-width: 0; }
.msg .label { font-size: 11.5px; color: var(--muted); margin: 0 12px 3px; }
.msg .av-slot { width: 28px; flex: none; }
.msg.codex { justify-content: flex-start; }
.msg.claude { justify-content: flex-end; }
.msg.claude .col { align-items: flex-end; }
.msg.claude .av-slot { order: 2; }

.bubble { padding: 8px 13px; border-radius: 19px; white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
.claude .bubble { background: linear-gradient(180deg, var(--claude-a), var(--claude-b)); color: var(--claude-text); border-bottom-right-radius: 6px; }
.codex .bubble { background: var(--codex-bubble); color: var(--codex-text); border-bottom-left-radius: 6px; }
.msg.cont.claude .bubble { border-top-right-radius: 8px; }
.msg.cont.codex .bubble { border-top-left-radius: 8px; }
.bubble pre { background: var(--code-bg); border-radius: 10px; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; }
.bubble code { background: var(--code-bg); border-radius: 5px; padding: 0 4px; font: 13px ui-monospace, "SF Mono", Menlo, monospace; }
.bubble table { display: block; overflow-x: auto; border-collapse: collapse; margin: 6px 0; font-size: 13px; white-space: normal; }
.bubble th, .bubble td { padding: 4px 10px 4px 0; border-bottom: 1px solid rgba(128, 128, 128, .25); text-align: left; vertical-align: top; }
.bubble th { font-weight: 700; }
.bubble .lnk { text-decoration: underline dotted; text-underline-offset: 3px; }
.claude .bubble pre, .claude .bubble code { background: rgba(255, 255, 255, .18); }
.bubble.clamp { max-height: 15.5em; overflow: hidden; }
.bubble.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: linear-gradient(transparent, var(--claude-b)); border-bottom-right-radius: 6px; }
.more { font-size: 12.5px; color: var(--claude-b); font-weight: 600; margin: 4px 12px 0; }
.bubble.question { background: var(--q-bg); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--q); }
.tag { font-size: 11.5px; font-weight: 700; margin: 4px 12px 0; color: var(--muted); }
.tag.q { color: var(--q); margin: 0 12px 4px; }
.tag.final { color: var(--ok); }

/* 입력 중 … */
.typing .bubble { padding: 11px 14px; display: inline-flex; gap: 5px; align-items: center; }
.typing .bubble i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .45; animation: hop 1.3s infinite; }
.typing .bubble i:nth-child(2) { animation-delay: .18s; }
.typing .bubble i:nth-child(3) { animation-delay: .36s; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
.typing .cap { font-size: 12px; color: var(--muted); margin: 4px 12px 0; }
.typing.stalled .bubble i { animation: none; }
.typing.stalled .cap { color: var(--warn); }

.welcome { height: 100%; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--muted); text-align: center; padding: 30px; }
.welcome img { width: min(260px, 60vw); height: auto; margin-bottom: 8px; }
.welcome b { color: var(--text); font-size: 17px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  main { display: none; }
  .app.chat-open aside { display: none; }
  .app.chat-open main { display: flex; }
  .chat-h .back { display: block; }
  .chat-h { padding: 8px 12px; }
  #feed { padding: 10px 10px 24px; }
  .msg .col { max-width: 84%; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="side-h">
      <h1>Codex 대화</h1>
      <label class="follow"><input type="checkbox" id="follow" checked> 새 대화 자동으로 열기</label>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <header class="chat-h" id="head"></header>
    <div id="banner"></div>
    <div id="feed"></div>
  </main>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hm = (ts) => ts ? new Date(ts).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) : '';
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const stamp = (ts) => {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  if (sameDay(d, now)) return '<b>오늘</b> ' + hm(ts);
  if (sameDay(d, now.getTime() - 86_400_000)) return '<b>어제</b> ' + hm(ts);
  return '<b>' + d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + '</b> ' + hm(ts);
};
const when = (ts) => {
  if (!ts) return '';
  const s = (Date.now() - new Date(ts)) / 1000;
  if (s < 60) return '방금';
  if (sameDay(ts, Date.now())) return hm(ts);
  if (sameDay(ts, Date.now() - 86_400_000)) return '어제';
  return new Date(ts).toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
};
const dur = (ms) => {
  const s = Math.max(0, Math.round((ms ?? 0) / 1000));
  if (s < 60) return s + '초';
  if (s < 3600) return Math.floor(s / 60) + '분 ' + (s % 60) + '초';
  return Math.floor(s / 3600) + '시간 ' + Math.floor(s % 3600 / 60) + '분';
};
const prettyModel = (m) => String(m || 'Codex').split('-')
  .map((p) => p === 'gpt' ? 'GPT' : /^[a-z]/.test(p) ? p[0].toUpperCase() + p.slice(1) : p).join('-');
const isQ = (t) => /^\s*QUESTION:/m.test(t || '');
// 최소한의 마크다운: ``` 코드 블록, 표, # 제목, [링크](주소)는 이름만, `코드`, **굵게**
const inline = (s) => s // s는 이미 escape된 글
  .replace(/\[([^\]]+)\]\((?:&lt;.*?&gt;|[^)\s]+)\)/g, '<span class="lnk">$1</span>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
function prose(text) {
  const lines = text.split('\n'), out = [];
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l ?? '');
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(esc(c.trim())));
  for (let i = 0; i < lines.length; i++) {
    if (isRow(lines[i]) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] ?? '')) {
      let html = '<table><tr>' + cells(lines[i]).map((c) => '<th>' + c + '</th>').join('') + '</tr>';
      for (i += 2; isRow(lines[i]); i++) html += '<tr>' + cells(lines[i]).map((c) => '<td>' + c + '</td>').join('') + '</tr>';
      i -= 1;
      out.push({ html: html + '</table>', block: true });
      continue;
    }
    const h = lines[i].match(/^#{1,6}\s+(.*)$/);
    out.push({ html: h ? '<b>' + inline(esc(h[1])) + '</b>' : inline(esc(lines[i])) });
  }
  // 표 앞뒤에는 줄바꿈을 넣지 않는다 (말풍선이 pre-wrap이라 빈 줄이 생김)
  return out.map((o, k) => (k && !o.block && !out[k - 1].block ? '\n' : '') + o.html).join('');
}
function md(text) {
  const parts = String(text ?? '').split(/```[^\n]*\n?/);
  return parts.map((p, i) => {
    if (i % 2) return '<pre>' + esc(p.replace(/\n$/, '')) + '</pre>';
    // 코드 블록 앞뒤 빈 줄은 말풍선 안에서 공백만 만든다
    if (i > 0) p = p.replace(/^\n+/, '');
    if (i < parts.length - 1) p = p.replace(/\n+$/, '');
    return prose(p);
  }).join('');
}

// 모델 계열별 아바타: 해(Sol) · 달(Luna) · 별(Astra) · 행성(Terra)
const FAMILY = [
  ['sol', '#f2a33a', 'S'], ['luna', '#5a67b8', 'L'], ['astra', '#8b5cf6', 'A'], ['terra', '#2f9e8f', 'T'],
];
function avatar(kind, size = '') {
  let file = 'avatar-codex', color = '#6b7280', letter = 'C';
  if (kind === 'claude') { file = 'avatar-claude'; color = '#d4643f'; letter = 'C'; }
  else {
    const f = FAMILY.find(([k]) => String(kind || '').toLowerCase().includes(k));
    if (f) { file = 'avatar-' + f[0]; color = f[1]; letter = f[2]; }
  }
  return '<span class="av ' + size + '" style="--c:' + color + '">' + letter +
    '<img src="/assets/' + file + '.png" alt="" onerror="this.remove()"></span>';
}

const STATUS = {
  running: '생각 중…', stalled: '응답 없음', question: 'Claude의 답을 기다리는 중',
  done: '작업 완료', aborted: '작업 중단됨', error: '오류로 끝남', idle: '대기 중',
};
function statusLine(t) {
  if (t.state === 'running') return t.activity?.label?.startsWith('명령') ? '작업 중…' : '생각 중…';
  if (t.state === 'question') return '질문을 남겼어요';
  return STATUS[t.state] ?? '';
}

let threads = [], current = null, since = 0, summary = null, gen = 0, polling = null, lost = null;
let follow = true;
try { follow = localStorage.getItem('follow') !== '0'; } catch {}
$('#follow').checked = follow;
$('#follow').onchange = (e) => { follow = e.target.checked; try { localStorage.setItem('follow', follow ? '1' : '0'); } catch {} };

// ---------------------------------------------------------------- 대화 목록
function renderList() {
  const byParent = {};
  for (const t of threads) if (t.parentId) (byParent[t.parentId] ??= []).push(t);
  const ids = new Set(threads.map((t) => t.id));
  const roots = threads.filter((t) => !t.parentId || !ids.has(t.parentId));
  const row = (t, child) => '<div class="conv' + (child ? ' child' : '') + (t.id === current ? ' active' : '') + '" data-id="' + t.id + '">' +
    avatar(t.model, child ? 'md' : '') + '<div class="txt"><div class="l1"><span class="name">' +
    esc(t.nickname ? t.nickname + ' · ' + prettyModel(t.model) : prettyModel(t.model)) + '</span><span class="when">' + when(t.updatedAt) + '</span></div>' +
    '<div class="ttl">' + esc(t.title) + '</div><div class="st ' + t.state + '">' + esc(statusLine(t)) + '</div></div></div>';
  $('#list').innerHTML = roots.map((t) => row(t, false) + (byParent[t.id] || []).map((c) => row(c, true)).join('')).join('')
    || '<div class="side-empty">아직 맡긴 작업이 없어요.</div>';
  for (const el of document.querySelectorAll('.conv')) el.onclick = () => pick(el.dataset.id);
}
function pick(id) { follow = false; $('#follow').checked = false; open(id); }

// ---------------------------------------------------------------- 대화창 머리
function renderHead() {
  const s = summary;
  if (!s) { $('#head').innerHTML = ''; return; }
  let cls = s.state, text = STATUS[s.state] ?? '';
  if (lost) { cls = 'lost'; text = '연결 끊김'; }
  else if (s.state === 'running') text = s.activity?.label?.startsWith('명령') ? '작업하는 중…' : '생각하는 중…';
  else if (s.state === 'done' && s.lastDurationMs != null) text = '작업 완료 · ' + dur(s.lastDurationMs) + ' 걸림';
  else if (s.state === 'stalled') text = '응답 없음 · ' + Math.floor((Date.now() - new Date(s.updatedAt)) / 60_000) + '분째 소식 없음';
  const name = (s.nickname ? s.nickname + ' · ' : '') + prettyModel(s.model);
  $('#head').innerHTML = '<button class="back" aria-label="목록으로">‹</button>' + avatar(s.model, 'md') +
    '<div class="who"><div class="nm">' + esc(name) + '</div><div class="sub ' + cls + '"><span class="dot"></span>' + esc(text) + '</div></div>';
  $('#head .back').onclick = () => { $('#app').classList.remove('chat-open'); history.replaceState(null, '', location.pathname); };
  document.title = (lost ? '연결 끊김' : STATUS[s.state] ?? '') + ' · ' + name;
}

// ---------------------------------------------------------------- 말풍선
let inner = null, lastSide = null, turn = null;
function reset() {
  $('#feed').innerHTML = '<div class="thread-inner"></div>';
  inner = $('#feed .thread-inner');
  lastSide = null; turn = null;
}
function newTurn(ts) {
  turn = { lastCodex: null, hasFinal: false, lastError: null, ended: false };
  inner.insertAdjacentHTML('beforeend', '<div class="stamp">' + stamp(ts) + '</div>');
  lastSide = null;
}
function bubble(side, html, { extraCls = '', label = '', tagTop = '', tagBottom = '' } = {}) {
  removeTyping();
  const cont = lastSide === side;
  const name = side === 'claude' ? 'Claude' : prettyModel(summary?.model);
  const row = document.createElement('div');
  row.className = 'msg ' + side + (cont ? ' cont' : ' first');
  row.innerHTML = '<div class="av-slot">' + (cont ? '' : avatar(side === 'claude' ? 'claude' : summary?.model, 'sm')) + '</div>' +
    '<div class="col">' + (cont ? '' : '<div class="label">' + esc(label || name) + '</div>') + tagTop +
    '<div class="bubble ' + extraCls + '">' + html + '</div>' + tagBottom + '</div>';
  inner.appendChild(row);
  lastSide = side;
  return row;
}
function sys(text, err) {
  removeTyping();
  inner.insertAdjacentHTML('beforeend', '<div class="sys' + (err ? ' err' : '') + '">' + esc(text) + '</div>');
  lastSide = null;
}
function markFinal(row, question) {
  const col = row.querySelector('.col'), b = row.querySelector('.bubble');
  if (question) {
    b.classList.add('question');
    b.insertAdjacentHTML('beforebegin', '<div class="tag q">? 질문</div>');
  } else b.insertAdjacentHTML('afterend', '<div class="tag final">✓ 최종 보고</div>');
  return col;
}

function addEvent(e) {
  switch (e.kind) {
    case 'turn_start': newTurn(e.ts); return;
    case 'manager': {
      if (!turn) newTurn(e.ts);
      const row = bubble('claude', esc(e.text));
      const b = row.querySelector('.bubble');
      if (b.scrollHeight > 15.5 * parseFloat(getComputedStyle(b).fontSize) * 1.45 + 20) {
        b.classList.add('clamp');
        b.insertAdjacentHTML('afterend', '<button class="more">더 보기</button>');
        const more = row.querySelector('.more');
        more.onclick = () => { const c = b.classList.toggle('clamp'); more.textContent = c ? '더 보기' : '접기'; };
      }
      return;
    }
    case 'agent': {
      if (!turn) newTurn(e.ts);
      const final = e.phase === 'final_answer';
      // 질문 표시가 따로 붙으므로 말풍선 안의 "QUESTION:" 머리말은 뺀다
      const row = bubble('codex', md(String(e.text ?? '').replace(/^\s*QUESTION:\s*/m, '')));
      turn.lastCodex = { row, text: e.text };
      if (final) { turn.hasFinal = true; markFinal(row, isQ(e.text)); }
      return;
    }
    case 'error': if (turn) turn.lastError = e; return;
    case 'turn_end': {
      if (!turn) return;
      turn.ended = true;
      if (e.aborted) sys('작업이 중단되었어요.');
      else if (!turn.hasFinal && turn.lastCodex) markFinal(turn.lastCodex.row, isQ(turn.lastCodex.text));
      else if (!turn.hasFinal && turn.lastError) sys('오류로 끝났어요: ' + turn.lastError.text, true);
      else if (!turn.hasFinal) sys('Codex가 답 없이 작업을 마쳤어요.');
      return;
    }
    default: return; // 명령 실행, 파일 수정, 생각 요약 등은 화면에 보여주지 않는다
  }
}

// 입력 중 표시: 작업 중일 때만 맨 아래에
function removeTyping() { $('#feed .typing')?.remove(); }
function renderTyping() {
  const s = summary;
  const on = s && !lost && (s.state === 'running' || s.state === 'stalled');
  const el = $('#feed .typing');
  if (!on) { el?.remove(); return; }
  const cap = s.state === 'stalled' ? '한동안 소식이 없어요 — 멈췄을 수 있어요'
    : s.activity?.label?.startsWith('명령') ? '작업하는 중' : '생각하는 중';
  if (el) {
    el.classList.toggle('stalled', s.state === 'stalled');
    el.querySelector('.cap').textContent = cap;
    return;
  }
  const cont = lastSide === 'codex';
  inner.insertAdjacentHTML('beforeend', '<div class="msg codex typing' + (cont ? ' cont' : ' first') + (s.state === 'stalled' ? ' stalled' : '') + '">' +
    '<div class="av-slot">' + (cont ? '' : avatar(s.model, 'sm')) + '</div><div class="col">' +
    '<div class="bubble"><i></i><i></i><i></i></div><div class="cap">' + cap + '</div></div></div>');
}

function welcome(text) {
  $('#head').innerHTML = '';
  $('#feed').innerHTML = '<div class="welcome"><img src="/assets/empty-state.png" alt="" onerror="this.remove()"><b>' + esc(text) +
    '</b><span>Claude가 Codex에게 일을 맡기면 두 모델의 대화가 여기에 실시간으로 나타나요.</span></div>';
}

// ---------------------------------------------------------------- 연결 끊김
function setLost(kind) {
  if (kind === lost) return;
  lost = kind;
  const b = $('#banner');
  b.classList.toggle('on', !!kind);
  b.textContent = kind === 'gone' ? '이 대화의 기록을 찾을 수 없어요. 마지막으로 받은 내용이에요.'
    : kind ? '연결이 끊겼어요. 아래는 마지막으로 받은 내용이라 실제와 다를 수 있어요.' : '';
  renderHead();
  renderTyping();
}

// ---------------------------------------------------------------- 불러오기
function atBottom() { const f = $('#feed'); return f.scrollHeight - f.scrollTop - f.clientHeight < 120; }

async function open(id) {
  current = id; since = 0; summary = null; gen += 1;
  setLost(null);
  reset();
  $('#app').classList.add('chat-open');
  // 따라가기 중에는 주소를 비워 둬야 새로 고침해도 계속 따라간다
  history.replaceState(null, '', follow ? location.pathname : '#' + id);
  renderList();
  await poll();
  if (id === current) $('#feed').scrollTop = $('#feed').scrollHeight;
}

async function poll() {
  if (!current || polling === gen) return;
  const g = gen, id = current;
  polling = g;
  try {
    const res = await fetch('/api/thread/' + id + '?since=' + since).catch(() => null);
    const r = res?.ok ? await res.json().catch(() => null) : null;
    if (g !== gen) return;
    // 서버가 꺼졌거나 기록이 사라지면 마지막 상태를 "작업 중"으로 붙잡고 있지 않는다
    setLost(!r ? (res?.status === 404 ? 'gone' : 'offline') : null);
    if (!r) return;
    const stick = atBottom();
    summary = r.summary;
    for (const e of r.events) addEvent(e);
    since = r.since + r.events.length;
    renderHead();
    renderTyping();
    if (stick) $('#feed').scrollTop = $('#feed').scrollHeight;
  } finally {
    if (polling === g) polling = null;
  }
}

async function refreshList() {
  const r = await fetch('/api/threads').then((x) => x.json()).catch(() => null);
  if (!r) { if (!current) setLost('offline'); return; }
  threads = r.threads;
  const newest = threads.find((t) => !t.parentId) ?? threads[0];
  if (follow && newest && newest.id !== current) open(newest.id);
  else renderList();
  if (!current) welcome(threads.length ? '대화를 골라 주세요' : '아직 맡긴 작업이 없어요');
}

(async () => {
  // 주소에 작업 ID(#...)가 있으면 그 대화를 고정해서 보여준다
  const hash = location.hash.slice(1);
  if (hash) { follow = false; $('#follow').checked = false; }
  // 좁은 화면에서는 목록부터 보여 준다
  if (!hash && matchMedia('(max-width: 760px)').matches) { follow = false; $('#follow').checked = false; }
  await refreshList();
  if (hash) open(hash);
  // 이미 열린 화면에서 다른 작업 링크(#...)를 눌러도 그 대화로 바꾼다
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== current) pick(h); });
  setInterval(poll, 1500);
  setInterval(refreshList, 4000);
  setInterval(renderHead, 15_000);
})();
</script>
</body>
</html>
